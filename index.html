<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A Little Surprise For You</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#ffe0eb,transparent 35%),radial-gradient(circle at 90% 90%,#e7e0ff,transparent 35%),#fff8f5;color:#382b43;font-family:Georgia,'Times New Roman',serif}.wrap{text-align:center;max-width:650px;width:100%;padding:clamp(24px,6vw,52px);background:#ffffffbd;border:1px solid #f1dce5;border-radius:30px;box-shadow:0 20px 60px #66465b12}.spark{font-size:2rem;color:#d87998}h1{font-weight:normal;font-size:clamp(2.5rem,8vw,4.6rem);line-height:1.05;margin:14px 0}p{font:1rem/1.7 Arial,sans-serif;color:#796b7d}.qr{display:flex;justify-content:center;margin:26px auto 18px;padding:15px;background:white;border:1px solid #f2e3e8;border-radius:20px;width:fit-content;min-width:220px;min-height:220px;align-items:center}.qr canvas,.qr img{max-width:100%;height:auto}.caption{font:700 .95rem Arial,sans-serif;letter-spacing:.04em;color:#a34f70}.note{font:.78rem/1.5 Arial,sans-serif;color:#968695;margin-top:18px}
</style></head><body><main class="wrap"><div class="spark">✦ ♡ ✦</div><h1>A little<br><em>surprise for you</em></h1><p>Someone left a few kind words just for you.<br>Scan the code to discover them.</p><div class="qr" id="qrcode"></div><div class="caption">SCAN ME TO READ MESSAGES</div><div class="note" id="status">The QR code activates after this page is published.</div></main>
<script>
(function(){const box=document.getElementById('qrcode'),status=document.getElementById('status');if(location.protocol==='file:'){box.textContent='QR appears after publishing';box.style.font='13px Arial';return;}const destination=new URL('messages.html',location.href).href;const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=()=>{new QRCode(box,{text:destination,width:190,height:190,colorDark:'#382b43',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});status.textContent='Scan the QR to open the messages page.'};s.onerror=()=>{status.textContent='QR could not load. Refresh while connected to the internet.'};document.head.appendChild(s)})();
</script></body></html>
